<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" style="background-color: #f5f5f5;">
  <!-- Browser window mockup -->
  <rect x="50" y="50" width="1100" height="700" rx="10" fill="white" stroke="#ccc" stroke-width="2"/>

  <!-- Browser chrome -->
  <rect x="50" y="50" width="1100" height="40" rx="10" fill="#e0e0e0" stroke="#ccc" stroke-width="2"/>
  <circle cx="80" cy="70" r="6" fill="#ff5f56"/>
  <circle cx="100" cy="70" r="6" fill="#ffbd2e"/>
  <circle cx="120" cy="70" r="6" fill="#27c93f"/>

  <!-- URL bar -->
  <rect x="160" y="60" width="700" height="20" rx="10" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="170" y="75" font-family="Arial, sans-serif" font-size="12" fill="#666">localhost:5051/patient-dashboard.html</text>

  <!-- Title -->
  <text x="600" y="130" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1976d2">
    Medical AI Calling System
  </text>
  <text x="600" y="160" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#666">
    Patient Dashboard
  </text>

  <!-- Stats cards -->
  <rect x="100" y="190" width="250" height="100" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="225" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Total Patients</text>
  <text x="225" y="260" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#1976d2">24</text>

  <rect x="380" y="190" width="250" height="100" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="505" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Calls Today</text>
  <text x="505" y="260" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#4caf50">12</text>

  <rect x="660" y="190" width="250" height="100" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="785" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Scheduled Calls</text>
  <text x="785" y="260" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#ff9800">8</text>

  <rect x="940" y="190" width="180" height="100" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="1030" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Success Rate</text>
  <text x="1030" y="260" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#9c27b0">96%</text>

  <!-- Patient list header -->
  <rect x="100" y="320" width="1020" height="40" fill="#1976d2"/>
  <text x="120" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Name</text>
  <text x="340" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">MRN</text>
  <text x="480" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Conditions</text>
  <text x="740" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Last Call</text>
  <text x="920" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Actions</text>

  <!-- Patient row 1 -->
  <rect x="100" y="360" width="1020" height="60" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="120" y="395" font-family="Arial, sans-serif" font-size="13" fill="#333">John Smith</text>
  <text x="340" y="395" font-family="Arial, sans-serif" font-size="13" fill="#666">MRN12345</text>
  <text x="480" y="395" font-family="Arial, sans-serif" font-size="12" fill="#666">Diabetes, Hypertension</text>
  <text x="740" y="395" font-family="Arial, sans-serif" font-size="12" fill="#666">2 hours ago</text>

  <rect x="920" y="375" width="80" height="30" rx="5" fill="#4caf50"/>
  <text x="960" y="396" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Call Now</text>

  <rect x="1015" y="375" width="90" height="30" rx="5" fill="#2196f3"/>
  <text x="1060" y="396" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">View Details</text>

  <!-- Patient row 2 -->
  <rect x="100" y="420" width="1020" height="60" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
  <text x="120" y="455" font-family="Arial, sans-serif" font-size="13" fill="#333">Sarah Johnson</text>
  <text x="340" y="455" font-family="Arial, sans-serif" font-size="13" fill="#666">MRN67890</text>
  <text x="480" y="455" font-family="Arial, sans-serif" font-size="12" fill="#666">Heart Failure, AFib</text>
  <text x="740" y="455" font-family="Arial, sans-serif" font-size="12" fill="#666">1 day ago</text>

  <rect x="920" y="435" width="80" height="30" rx="5" fill="#4caf50"/>
  <text x="960" y="456" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Call Now</text>

  <rect x="1015" y="435" width="90" height="30" rx="5" fill="#2196f3"/>
  <text x="1060" y="456" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">View Details</text>

  <!-- Patient row 3 -->
  <rect x="100" y="480" width="1020" height="60" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="120" y="515" font-family="Arial, sans-serif" font-size="13" fill="#333">Michael Chen</text>
  <text x="340" y="515" font-family="Arial, sans-serif" font-size="13" fill="#666">MRN24680</text>
  <text x="480" y="515" font-family="Arial, sans-serif" font-size="12" fill="#666">COPD, Asthma</text>
  <text x="740" y="515" font-family="Arial, sans-serif" font-size="12" fill="#666">3 days ago</text>

  <rect x="920" y="495" width="80" height="30" rx="5" fill="#4caf50"/>
  <text x="960" y="516" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Call Now</text>

  <rect x="1015" y="495" width="90" height="30" rx="5" fill="#2196f3"/>
  <text x="1060" y="516" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">View Details</text>

  <!-- Patient row 4 -->
  <rect x="100" y="540" width="1020" height="60" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
  <text x="120" y="575" font-family="Arial, sans-serif" font-size="13" fill="#333">Emily Rodriguez</text>
  <text x="340" y="575" font-family="Arial, sans-serif" font-size="13" fill="#666">MRN13579</text>
  <text x="480" y="575" font-family="Arial, sans-serif" font-size="12" fill="#666">Post-Surgery Recovery</text>
  <text x="740" y="575" font-family="Arial, sans-serif" font-size="12" fill="#666">5 hours ago</text>

  <rect x="920" y="555" width="80" height="30" rx="5" fill="#4caf50"/>
  <text x="960" y="576" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Call Now</text>

  <rect x="1015" y="555" width="90" height="30" rx="5" fill="#2196f3"/>
  <text x="1060" y="576" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">View Details</text>

  <!-- Bottom action bar -->
  <rect x="100" y="620" width="1020" height="50" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>

  <rect x="120" y="632" width="140" height="28" rx="5" fill="#2196f3"/>
  <text x="190" y="652" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">+ Add Patient</text>

  <rect x="280" y="632" width="160" height="28" rx="5" fill="#ff9800"/>
  <text x="360" y="652" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Schedule Call</text>

  <rect x="460" y="632" width="140" height="28" rx="5" fill="#9c27b0"/>
  <text x="530" y="652" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">View Reports</text>

  <rect x="920" y="632" width="180" height="28" rx="5" fill="#666"/>
  <text x="1010" y="652" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Export to CSV</text>

  <!-- Footer -->
  <text x="600" y="720" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#999">
    Medical AI Calling System v1.0 • Connected to Firestore • Last sync: 2 minutes ago
  </text>
</svg>
