<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background-color: white;">
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">
    Medical AI Calling System - Architecture
  </text>

  <!-- Patient/User -->
  <rect x="330" y="50" width="140" height="60" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="400" y="75" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Patient / User</text>
  <text x="400" y="95" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">Phone Call</text>

  <!-- Arrow -->
  <path d="M 400 110 L 400 140" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="130" font-family="Arial, sans-serif" font-size="11" fill="#666">① Phone Call</text>

  <!-- Twilio Voice -->
  <rect x="280" y="140" width="240" height="80" rx="10" fill="#f44336" stroke="#c62828" stroke-width="2"/>
  <text x="400" y="165" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Twilio Voice</text>

  <rect x="290" y="175" width="100" height="35" rx="5" fill="white" stroke="#c62828" stroke-width="1"/>
  <text x="340" y="198" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">Inbound</text>

  <rect x="410" y="175" width="100" height="35" rx="5" fill="white" stroke="#c62828" stroke-width="1"/>
  <text x="460" y="198" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">Outbound</text>

  <!-- Arrow -->
  <path d="M 400 220 L 400 260" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="480" y="245" font-family="Arial, sans-serif" font-size="11" fill="#666">② Media Stream (WebSocket)</text>

  <!-- Fastify Server -->
  <rect x="230" y="260" width="340" height="100" rx="10" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
  <text x="400" y="285" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Fastify Server (Node.js)</text>

  <rect x="250" y="295" width="300" height="55" rx="5" fill="white" stroke="#2e7d32" stroke-width="1"/>
  <text x="400" y="315" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">WebSocket Orchestration</text>
  <text x="400" y="330" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">• Audio relay & buffering</text>
  <text x="400" y="343" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">• Conversation state management</text>

  <!-- Arrow -->
  <path d="M 400 360 L 400 390" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="520" y="380" font-family="Arial, sans-serif" font-size="11" fill="#666">③ Audio Stream (PCM 16-bit)</text>

  <!-- OpenAI Realtime API -->
  <rect x="230" y="390" width="340" height="90" rx="10" fill="#9c27b0" stroke="#6a1b9a" stroke-width="2"/>
  <text x="400" y="415" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">OpenAI Realtime API (GPT-4)</text>
  <text x="400" y="435" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">• Speech-to-Text (real-time)</text>
  <text x="400" y="450" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">• AI Conversation</text>
  <text x="400" y="465" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">• Text-to-Speech (natural voice)</text>

  <!-- Arrow -->
  <path d="M 400 480 L 400 510" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="500" y="500" font-family="Arial, sans-serif" font-size="11" fill="#666">④ Store data</text>

  <!-- Firebase Firestore -->
  <rect x="230" y="510" width="340" height="70" rx="10" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
  <text x="400" y="535" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Firebase Firestore / File System</text>
  <text x="400" y="555" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Patients • Transcripts • Audit Logs • Scheduled Calls</text>

  <!-- Decorative elements -->
  <rect x="30" y="140" width="200" height="140" rx="10" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="130" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Key Features</text>
  <text x="40" y="195" font-family="Arial, sans-serif" font-size="11" fill="#666">✓ Bi-directional calls</text>
  <text x="40" y="215" font-family="Arial, sans-serif" font-size="11" fill="#666">✓ Real-time transcription</text>
  <text x="40" y="235" font-family="Arial, sans-serif" font-size="11" fill="#666">✓ Patient management</text>
  <text x="40" y="255" font-family="Arial, sans-serif" font-size="11" fill="#666">✓ Webhook notifications</text>

  <rect x="570" y="140" width="200" height="140" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="670" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Technology Stack</text>
  <text x="580" y="195" font-family="Arial, sans-serif" font-size="11" fill="#666">• Node.js 18+</text>
  <text x="580" y="215" font-family="Arial, sans-serif" font-size="11" fill="#666">• Fastify Framework</text>
  <text x="580" y="235" font-family="Arial, sans-serif" font-size="11" fill="#666">• WebSocket (ws)</text>
  <text x="580" y="255" font-family="Arial, sans-serif" font-size="11" fill="#666">• Google Cloud Run</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#333"/>
    </marker>
  </defs>
</svg>
